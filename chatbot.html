<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medic Bot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <img src="img.png" alt="Medic Bot Icon" class="bot-icon">
            <h2>Medic Bot</h2>
        </div>
        <div class="chat-box" id="chat-box"></div>
        <div class="chat-input">
            <input type="text" id="user-input" placeholder="Ask a question..." onchange="KeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>

        document.getElementById("user-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });        
        
        async function sendMessage() {
            const userInput = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const userMessage = userInput.value.trim();
        
            if (userMessage === "") return;
        
            chatBox.innerHTML += `<div class="message user-message">${userMessage}</div>`;
            const botThinking = document.createElement("div");
            botThinking.className = "message bot-thinking";
            botThinking.innerHTML = `<span class="dot"></span><span class="dot"></span><span class="dot"></span> Bot is thinking...`;
            chatBox.appendChild(botThinking);

            userInput.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;
        
            try {
                const response = await fetch("http://127.0.0.1:8000/ask", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question: userMessage })
                });
        
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
        
                const data = await response.json();
        
                // Remove "thinking..." message
                botThinking.remove();
        
                // Append bot response
                chatBox.innerHTML += `<div class="message bot-message">${data.answer}</div>`;
            } catch (error) {
                botThinking.remove();
                chatBox.innerHTML += `<div class="message error">Error: ${error.message}</div>`;
            }
        
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
